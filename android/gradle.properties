org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true

# The website the app opens. Set to your real domain before a release build,
# e.g. proppage.in (no https://, no path).
proppageHost=REPLACE-WITH-YOUR-DOMAIN
proppageScheme=https
# Permanent once published on Google Play: choose carefully.
proppageAppId=com.rturox.proppage
proppageAppName=PropPage
# Raise by 1 for every new APK or Google Play upload.
proppageVersionCode=1
proppageVersionName=1.0.0
