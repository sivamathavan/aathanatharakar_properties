<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 2450" width="100%" height="100%">
  <defs>
    <!-- Modern 2026 Typography Styling -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Noto+Sans+Tamil:wght@400;500;700&amp;display=swap');
      
      /* Typography Classes */
      .bc-tamil-title { font-family: 'Noto Sans Tamil', sans-serif; font-weight: 700; font-size: 14px; fill: #E5C158; letter-spacing: 1px; }
      .bc-en-brand { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 24px; fill: #FFFFFF; letter-spacing: -0.5px; }
      .bc-tagline { font-family: 'Noto Sans Tamil', sans-serif; font-weight: 400; font-size: 10px; fill: #A0AAB5; letter-spacing: 0.5px; }
      .bc-card-holder { font-family: 'Noto Sans Tamil', sans-serif; font-weight: 700; font-size: 20px; fill: #FFFFFF; letter-spacing: 0.5px; }
      .bc-card-holder-en { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; fill: #A0AAB5; letter-spacing: 1px; }
      .bc-card-title { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 11px; fill: #E5C158; letter-spacing: 2px; }
      .bc-contact-value { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; fill: #FFFFFF; }
      .bc-address-value-tm { font-family: 'Noto Sans Tamil', sans-serif; font-weight: 400; font-size: 11px; fill: #FFFFFF; }
      
      .logo-tamil-title { font-family: 'Noto Sans Tamil', sans-serif; font-weight: 700; font-size: 32px; fill: #E5C158; letter-spacing: 2px; }
      .logo-en-brand { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 56px; fill: #FFFFFF; letter-spacing: -1px; }
      .logo-en-accent { fill: #E5C158; }
      .logo-tagline-en { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 16px; fill: #A0AAB5; letter-spacing: 3px; }
      .logo-tagline-tm { font-family: 'Noto Sans Tamil', sans-serif; font-weight: 500; font-size: 18px; fill: #E5C158; letter-spacing: 1px; }
      .logo-meta { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11px; fill: #E5C158; letter-spacing: 6px; }
      
      .display-mono { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 84px; fill: #FFFFFF; letter-spacing: -2px; }
    </style>

    <!-- 2026 Neo-Gopuram Structural Design Component -->
    <g id="neoGopuramAsset">
      <path d="M-80,60 A100,100 0 0,1 80,60" fill="none" stroke="#E5C158" stroke-width="2" opacity="0.2"/>
      <path d="M-60,50 L60,50" stroke="#E5C158" stroke-width="4" stroke-linecap="round"/>
      <path d="M-40,75 L40,75" stroke="#E5C158" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
      <!-- Stepped Linear Ascents -->
      <path d="M-45,35 L0,-10 L45,35" fill="none" stroke="#E5C158" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-35,10 L0,-30 L35,10" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-25,-15 L0,-50 L25,-15" fill="none" stroke="#E5C158" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-15,-40 L0,-65 L15,-40" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="-80" r="5" fill="#E5C158"/>
    </g>

    <!-- UI/UX Vector Communication Icons -->
    <g id="iconCall">
      <path d="M4,2 A3,3 0 0,0 1,5 v2 a14,14 0 0,0 14,14 h2 a3,3 0 0,0 3,-3 V15 a1,1 0 0,0 -1,-1 L15,13.5 a1,1 0 0,0 -1,0.5 L12.5,15.5 A11,11 0 0,1 4.5,7.5 L6.5,6 a1,1 0 0,0 0.5,-1 L6.5,1 a1,1 0 0,0 -1,-1 Z" fill="#E5C158" transform="scale(0.9)"/>
    </g>
    <g id="iconMail">
      <path d="M2,4 h16 a2,2 0 0,1 2,2 v12 a2,2 0 0,1 -2,2 H2 a2,2 0 0,1 -2,-2 V6 a2,2 0 0,1 2,-2 Z M2,7.5 L10,12.5 L18,7.5 V6 L10,11 L2,6 Z" fill="#E5C158" transform="scale(0.9)"/>
    </g>
    <g id="iconLocation">
      <path d="M10,0 A8,8 0 0,0 2,8 c0,6 8,14 8,14 s8,-8 8,-14 A8,8 0 0,0 10,0 Z M10,11 A3,3 0 1,1 13,8 A3,3 0 0,1 10,11 Z" fill="#E5C158" transform="scale(0.9)"/>
    </g>

    <linearGradient id="obsidianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1626"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>
  </defs>

  <!-- ===================================================================== -->
  <!-- ASSET 1: PRIMARY HORIZONTAL LOGO                                     -->
  <!-- ===================================================================== -->
  <g id="component-horizontal-logo" transform="translate(0, 0)">
    <rect x="0" y="0" width="1400" height="560" fill="url(#obsidianGrad)"/>
    <line x1="50" y1="50" x2="1350" y2="50" stroke="#E5C158" stroke-width="1" opacity="0.15"/>
    <line x1="50" y1="510" x2="1350" y2="510" stroke="#E5C158" stroke-width="1" opacity="0.15"/>

    <!-- Left Architectural Icon -->
    <g transform="translate(260, 270) scale(1.6)">
      <use href="#neoGopuramAsset"/>
    </g>

    <!-- Typography Block -->
    <g transform="translate(520, 0)">
      <!-- Line 1: Tamil Title -->
      <text x="0" y="160" class="logo-tamil-title">ஆதனத் தரகர்</text>
      
      <!-- Line 2: "Aadana" in White + "Tharakar" in Gold on Same Baseline -->
      <text x="0" y="240" class="logo-en-brand">Aadana<tspan class="logo-en-accent">Tharakar</tspan></text>
      
      <!-- Linear Dynamic Rules -->
      <line x1="0" y1="275" x2="180" y2="275" stroke="#E5C158" stroke-width="4"/>
      <line x1="190" y1="275" x2="550" y2="275" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>

      <!-- Line 3: 2026 Tamil Tagline -->
      <text x="0" y="325" class="logo-tagline-tm">உங்களுக்கான இடத்தை தேர்வு செய்யுங்கள்</text>

      <!-- Line 4: English Tagline -->
      <text x="0" y="365" class="logo-tagline-en">TAMIL NADU'S TRUSTED PROPERTY MARKETPLACE</text>

      <!-- Line 5: Meta Info -->
      <text x="0" y="430" class="logo-meta">COIMBATORE • EST. 2025 • PROPTECH</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- ASSET 2: PREMIUM BUSINESS CARD (Front & Back Presentation)           -->
  <!-- ===================================================================== -->
  <g id="component-business-card" transform="translate(50, 620)">
    <!-- Section Title Indicator -->
    <text x="0" y="40" font-family="'Inter', sans-serif" font-weight="600" font-size="20" fill="#E5C158" letter-spacing="2">BUSINESS CARD (915×510px Equivalent Front/Back Layout)</text>
    
    <!-- CARD FRONT DIRECTION -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="600" height="340" rx="16" fill="#0A0E17" stroke="#E5C158" stroke-width="1.5"/>
      <path d="M420,0 L600,180 L600,0 Z" fill="#E5C158" opacity="0.03"/>
      
      <!-- Centered Icon Mark -->
      <g transform="translate(300, 140) scale(1)">
        <use href="#neoGopuramAsset"/>
      </g>
      <!-- Logotype Below Icon -->
      <text x="300" y="260" text-anchor="middle" class="bc-en-brand" font-size="28">Aadana<tspan fill="#E5C158">Tharakar</tspan></text>
      <text x="300" y="290" text-anchor="middle" class="bc-tamil-title" font-size="12" fill="#A0AAB5">உங்களுக்கான இடத்தை தேர்வு செய்யுங்கள்</text>
    </g>

    <!-- CARD BACK DIRECTION (Updated with requested founder information) -->
    <g transform="translate(650, 80)">
      <rect x="0" y="0" width="600" height="340" rx="16" fill="url(#obsidianGrad)" stroke="#E5C158" stroke-width="1"/>
      <rect x="15" y="15" width="570" height="310" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.04"/>
      
      <!-- Left Align Corporate Identity -->
      <g transform="translate(40, 55)">
        <text x="0" y="0" class="bc-tamil-title">ஆதனத் தரகர்</text>
        <text x="0" y="30" class="bc-en-brand" font-size="22">Aadana<tspan fill="#E5C158">Tharakar</tspan></text>
        <line x1="0" y1="42" x2="110" y2="42" stroke="#E5C158" stroke-width="2"/>
      </g>

      <!-- Founder Name and Designation -->
      <g transform="translate(40, 205)">
        <text x="0" y="0" class="bc-card-holder">தமிழரசன்</text>
        <text x="0" y="24" class="bc-card-holder-en">Tamilarasan</text>
        <text x="0" y="44" class="bc-card-title">FOUNDER</text>
      </g>

      <!-- Right Alignment Contact Blocks (No Website, Using Functional Icons) -->
      <g transform="translate(315, 60)">
        <line x1="-20" y1="0" x2="-20" y2="220" stroke="#E5C158" stroke-width="1" opacity="0.15"/>
        
        <!-- Call Details Line -->
        <g transform="translate(0, 15)">
          <use href="#iconCall" x="0" y="0"/>
          <text x="32" y="14" class="bc-contact-value" font-weight="600">63829 87874</text>
          <text x="32" y="32" class="bc-contact-value" font-weight="600">63811 69124</text>
        </g>
        
        <!-- Mail Details Line -->
        <g transform="translate(0, 80)">
          <use href="#iconMail" x="0" y="0"/>
          <text x="32" y="14" class="bc-contact-value">aadanatharakarproperty@gmail.com</text>
        </g>
        
        <!-- Physical Structural Address Line -->
        <g transform="translate(0, 135)">
          <use href="#iconLocation" x="0" y="0"/>
          <text x="32" y="14" class="bc-address-value-tm" font-weight="500">வடவள்ளி, கோயம்புத்தூர் - 641041</text>
          <text x="32" y="34" class="bc-contact-value" fill="#A0AAB5" font-size="11">Vadavalli, Coimbatore - 641041</text>
          <text x="32" y="50" class="bc-contact-value" fill="#E5C158" font-size="10" letter-spacing="1">TAMIL NADU</text>
        </g>
      </g>

      <!-- Card Base Accent Edge -->
      <rect x="40" y="295" width="520" height="1" fill="#E5C158" opacity="0.15"/>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- ASSET 3 & 4 & 5: APP ICON, MONOGRAM & FAVICON INDEPENDENT LAYOUTS     -->
  <!-- ===================================================================== -->
  
  <!-- SQUARE APP ICON (512x512px Asset) -->
  <g id="component-square-icon" transform="translate(50, 1180)">
    <text x="0" y="40" font-family="'Inter', sans-serif" font-weight="600" font-size="20" fill="#E5C158" letter-spacing="2">SQUARE APP ICON (512×512px)</text>
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="#0A0E17" stroke="#E5C158" stroke-width="1.5"/>
      <rect x="18" y="18" width="476" height="476" rx="98" ry="98" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
      <!-- Centered Icon Mark -->
      <g transform="translate(256, 210) scale(1.85)">
        <use href="#neoGopuramAsset"/>
      </g>
      <!-- Typography Connection -->
      <text x="256" y="425" text-anchor="middle" class="display-mono" font-size="72">AT<tspan fill="#E5C158">.</tspan></text>
      <rect x="231" y="455" width="50" height="4" rx="2" fill="#E5C158"/>
    </g>
  </g>

  <!-- MONOGRAM MARK (Independent Design Display Asset) -->
  <g id="component-monogram" transform="translate(650, 1180)">
    <text x="0" y="40" font-family="'Inter', sans-serif" font-weight="600" font-size="20" fill="#E5C158" letter-spacing="2">INDEPENDENT MONOGRAM</text>
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="340" height="512" rx="24" fill="url(#obsidianGrad)" stroke="#E5C158" stroke-width="1" opacity="0.5"/>
      
      <!-- Interlaced High-Tech Luxury Monogram Setup -->
      <g transform="translate(170, 230)">
        <circle cx="0" cy="0" r="110" fill="none" stroke="#E5C158" stroke-width="1" opacity="0.15"/>
        <circle cx="0" cy="0" r="120" fill="none" stroke="#E5C158" stroke-width="2" stroke-dasharray="6,4" opacity="0.4"/>
        
        <!-- The Monogram Letters Typography -->
        <text x="0" y="30" text-anchor="middle" class="display-mono" font-size="102" fill="#FFFFFF">AT</text>
        
        <!-- Architectural Overlays linking it to Real Estate Core -->
        <path d="M-60,-40 L0,-100 L60,-40" fill="none" stroke="#E5C158" stroke-width="4" stroke-linecap="round"/>
        <circle cx="0" cy="-115" r="4" fill="#E5C158"/>
      </g>
      
      <!-- Branding Accent Base Label -->
      <text x="170" y="440" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#E5C158" letter-spacing="4">AADANA THARAKAR</text>
      <text x="170" y="465" text-anchor="middle" font-family="'Noto Sans Tamil', sans-serif" font-weight="400" font-size="11" fill="#A0AAB5">வடிவமைப்பு முத்திரை</text>
    </g>
  </g>

  <!-- FAVICON SYSTEM (Multi-Resolution Target Display) -->
  <g id="component-favicon" transform="translate(1080, 1180)">
    <text x="0" y="40" font-family="'Inter', sans-serif" font-weight="600" font-size="20" fill="#E5C158" letter-spacing="2">FAVICON SIZES</text>
    
    <!-- Large Favicon Target Model (e.g. 128x128 Representation) -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="128" height="128" rx="24" fill="#0A0E17" stroke="#E5C158" stroke-width="1.5"/>
      <path d="M34,68 L64,38 L94,68" fill="none" stroke="#E5C158" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M44,82 L64,62 L84,82" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="64" cy="24" r="3.5" fill="#E5C158"/>
      <text x="64" y="114" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" letter-spacing="-0.5">AT</text>
      <text x="0" y="155" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#A0AAB5">128×128 px</text>
    </g>

    <!-- Standard Tab Favicon Model (64x64 Representation) -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="64" height="64" rx="12" fill="#0A0E17" stroke="#E5C158" stroke-width="1"/>
      <path d="M18,36 L32,22 L46,36" fill="none" stroke="#E5C158" stroke-width="3" stroke-linecap="round"/>
      <path d="M24,46 L32,38 L40,46" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <circle cx="32" cy="14" r="2" fill="#E5C158"/>
      <text x="0" y="90" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#A0AAB5">64×64 px Web Tab</text>
    </g>

    <!-- Micro Favicon Model (32x32 Standard) -->
    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="32" height="32" rx="6" fill="#0A0E17"/>
      <path d="M6,20 L16,10 L26,20 L22,24 L16,18 L10,24 Z" fill="#E5C158"/>
      <circle cx="16" cy="6" r="1.5" fill="#FFFFFF"/>
      <text x="0" y="55" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#A0AAB5">32×32 px Micro</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- ARTBOARD FOOTER NOTE ACCENT                                          -->
  <!-- ===================================================================== -->
  <g id="artboard-footer" transform="translate(50, 1820)">
    <line x1="0" y1="0" x2="1300" y2="0" stroke="#E5C158" stroke-width="1" opacity="0.2"/>
    <text x="0" y="40" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#A0AAB5">
      <tspan fill="#E5C158" font-weight="600">2026 CORPORATE STATIONERY UPDATE:</tspan> Founder Profile: Tamilarasan • Location: Vadavalli, Coimbatore • Contact Grid with Minimalist Vector Icons.
    </text>
    <text x="0" y="65" font-family="'Inter', sans-serif" font-weight="400" font-size="13" fill="#A0AAB5">
      Website indicators removed from backend structure. Layout metrics mathematically balanced to display clean bilingual information for international and domestic Tamil Nadu real estate trading.
    </text>
  </g>
</svg>
