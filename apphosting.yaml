# Firebase App Hosting (Cloud Run). minInstances 1 keeps one server warm so a
# client opening an agent's link from WhatsApp doesn't wait for a cold start
# (a small fixed monthly cost). Set it back to 0 to pay only for visits.
runConfig:
  minInstances: 1
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # The new production project (LAUNCH.md step 1). Copy these from Firebase
  # console → Project settings → Your apps → Web app. The web API key is public
  # by design (it ships in every browser bundle).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE-WITH-NEW-PROJECT-API-KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE-WITH-NEW-PROJECT-ID.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE-WITH-NEW-PROJECT-ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: REPLACE-WITH-NEW-PROJECT-ID.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "REPLACE-WITH-SENDER-ID"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE-WITH-NEW-WEB-APP-ID
    availability: [BUILD, RUNTIME]
  # Set to the real address before the first deploy: the App Hosting URL
  # (shown when the backend is created) or your own domain once it's connected.
  # Share links and WhatsApp previews are built from it.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://REPLACE-WITH-YOUR-DOMAIN
    availability: [BUILD, RUNTIME]

  # Product name and support contact (lib/brand.ts). Rename here, no code change.
  - variable: NEXT_PUBLIC_BRAND_NAME
    value: PropPage
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_COMPANY_NAME
    value: Rturox
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_COMPANY_URL
    value: https://rturox.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SUPPORT_EMAIL
    value: ""
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SUPPORT_WHATSAPP
    value: ""
    availability: [BUILD, RUNTIME]
  # Name of the grievance officer shown in the privacy policy (DPDP Act).
  - variable: NEXT_PUBLIC_GRIEVANCE_OFFICER
    value: ""
    availability: [BUILD, RUNTIME]

  # Where new-signup and payment alerts go.
  - variable: ADMIN_EMAIL
    value: ""
  # Transactional email service (LAUNCH.md section 3). Copy host, port and user
  # from the service's SMTP page; the domain needs its SPF/DKIM/DMARC records.
  - variable: SMTP_HOST
    value: ""
  - variable: SMTP_PORT
    value: "587"
  - variable: SMTP_USER
    value: ""
  # Sender shown to agents, on your own domain.
  - variable: MAIL_FROM
    value: "PropPage <hello@REPLACE-WITH-YOUR-DOMAIN>"
  # SMTP password, stored in Secret Manager:
  #   firebase apphosting:secrets:set smtp-password
  - variable: SMTP_PASSWORD
    secret: smtp-password
  # Shared secret for the daily reminder job (Cloud Scheduler → /api/cron/daily):
  #   firebase apphosting:secrets:set cron-secret
  - variable: CRON_SECRET
    secret: cron-secret

  # Voice listing ("Speak or paste your listing"). Which AI reads listings:
  #   gemini — for the first agents (about 50). Key in Secret Manager:
  #            firebase apphosting:secrets:set gemini-api-key
  #   claude — later. Set the secret anthropic-api-key, uncomment the two Claude
  #            lines below, then change LISTING_AI_PROVIDER to claude.
  # Monthly limits per plan are in Admin → Plans & settings.
  - variable: LISTING_AI_PROVIDER
    value: gemini
  - variable: GEMINI_API_KEY
    secret: gemini-api-key
  # Flash-Lite won the comparison (npm run eval:drafts): 98% of fields right, fast,
  # 15 requests a minute on the free tier.
  - variable: LISTING_AI_GEMINI_MODEL
    value: gemini-3.5-flash-lite
  # - variable: ANTHROPIC_API_KEY
  #   secret: anthropic-api-key
  # claude-haiku-5-5 costs far less per listing than claude-opus-5-5.
  - variable: LISTING_AI_MODEL
    value: claude-opus-5-5

  # Android app (Play Store): served at /.well-known/assetlinks.json so the app
  # opens full screen. Fingerprint from Play Console → App integrity.
  - variable: ANDROID_PACKAGE_NAME
    value: com.rturox.proppage
  - variable: ANDROID_CERT_SHA256
    value: ""
